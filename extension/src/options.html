<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EntityTrack Collector — Settings</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font: 14px/1.5 system-ui, sans-serif;
        background: #121212; color: #e0e0e0;
        margin: 0; padding: 24px; max-width: 460px;
      }
      h1 { font-size: 16px; margin: 0 0 16px; }
      label { display: block; margin: 14px 0 4px; color: #b0b0b0; }
      input[type="text"], input[type="url"], input[type="number"] {
        width: 100%; box-sizing: border-box; padding: 7px 9px;
        background: #1e1e1e; border: 1px solid #333; border-radius: 4px; color: #e0e0e0;
      }
      .row { display: flex; align-items: center; gap: 8px; margin: 14px 0; }
      button {
        margin-top: 18px; padding: 8px 16px; border: 1px solid #333;
        background: #1e1e1e; color: #e0e0e0; border-radius: 4px; cursor: pointer;
      }
      button:hover { border-color: #8b0000; }
      #status { margin-top: 16px; padding: 10px; border: 1px solid #333; border-radius: 4px;
        white-space: pre-wrap; font-size: 12px; color: #a0a0a0; }
      .err { color: #ff6b6b; }
      .saved { color: #6bd06b; }
    </style>
  </head>
  <body>
    <h1>EntityTrack Collector</h1>

    <div class="row">
      <input type="checkbox" id="enabled" />
      <label for="enabled" style="margin: 0">Collecting enabled</label>
    </div>

    <label for="backendUrl">Backend URL</label>
    <input type="url" id="backendUrl" placeholder="http://localhost:8787" />

    <label for="ingestToken">Ingest token (must match the backend's INGEST_TOKEN)</label>
    <input type="text" id="ingestToken" />

    <label for="pollMinutes">Poll interval (minutes, min 10)</label>
    <input type="number" id="pollMinutes" min="10" step="1" />

    <div>
      <button id="save">Save</button>
      <button id="runNow">Run now</button>
    </div>

    <div id="status">loading…</div>

    <script type="module" src="options.js"></script>
  </body>
</html>
